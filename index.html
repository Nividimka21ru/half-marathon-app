<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__logo">FT</span>
        <div>
          <h1>Fitness Tracker</h1>
          <p>Мини-продукт для тренировок</p>
        </div>
      </div>
      <div class="topbar__actions">
        <button class="icon-button" id="themeToggle" aria-label="Toggle theme">
          <span class="icon">🌗</span>
        </button>
        <div class="user-chip" id="userChip"></div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/add-workout" data-route="add-workout">Add Workout</a>
        <a href="#/history" data-route="history">History</a>
        <a href="#/calendar" data-route="calendar">Calendar</a>
        <a href="#/goals" data-route="goals">Goals</a>
        <a href="#/achievements" data-route="achievements">Achievements</a>
        <a href="#/friends" data-route="friends">Friends</a>
        <a href="#/messages" data-route="messages">Messages</a>
        <a href="#/profile" data-route="profile">Profile</a>
        <a href="#/settings" data-route="settings">Settings</a>
        <button class="nav__logout" id="logoutButton">Logout</button>
      </nav>
    </aside>

    <main class="content" id="content"></main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="modal" id="modal">
    <div class="modal__content">
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__actions" id="modalActions"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
